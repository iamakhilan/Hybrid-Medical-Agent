apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medical-agent-data
  namespace: hybrid-medical-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-agent-api
  namespace: hybrid-medical-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medical-agent-api
  template:
    metadata:
      labels:
        app: medical-agent-api
    spec:
      containers:
        - name: api
          image: hybrid-medical-agent:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "hybrid_agent.api"]
          ports:
            - name: http
              containerPort: 7860
          envFrom:
            - configMapRef:
                name: hybrid-medical-agent-config
            - secretRef:
                name: hybrid-medical-agent-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medical-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: medical-agent-api
  namespace: hybrid-medical-agent
spec:
  type: ClusterIP
  selector:
    app: medical-agent-api
  ports:
    - name: http
      port: 7860
      targetPort: http
